name: Validate Zoid Life

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Test simulation rules
        run: npm test
      - name: Type-check and build
        run: npm run build
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
      - name: Test game in Chromium
        run: npm run test:e2e
      - name: Upload visual review captures
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zoidlife-visual-qa
          path: test-results/visual/
          retention-days: 7
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zoidlife-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
